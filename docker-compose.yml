version: '3.8'
services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONPATH=/app/src
    working_dir: /app/src
    command: >
      sh -c "sleep 10 && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - inventario_red

  db:
    image: postgres:13.22-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword 
    networks:
      - inventario_red

networks:
  inventario_red:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24  # <--- Esto evita el choque con tu IP 10.12.12.41

volumes:
  postgres_data:
